tasks.jar {
    archiveClassifier = "dev"
    destinationDirectory = file("$buildDir/devlibs")
    exclude("META-INF/jarjar/**")
    from("LICENSE")
}

// Add sources jar to components.java
java {
    withSourcesJar()
}

base {
    archivesName = "${project.name}-${libs.versions.minecraft.get()}"
}

afterEvaluate {
    tasks.named("sourcesJar", Jar).configure {
        enabled = false
    }

    reobfJar.archiveClassifier = ""
    reobfJar.destinationDirectory = file('build/libs/')
    tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
        manifest.attributes([
                'MixinConfigs': 'gtceu.mixins.json',
                'Specification-Title': project.name,
                'Specification-Version': mod_version,
                'Specification-Vendor': 'GregTechCEu Team',
                'Implementation-Title': base.archivesName,
                'Implementation-Version': version,
                'Implementation-Vendor': 'GregTechCEu Team',
        ])
    }
}
