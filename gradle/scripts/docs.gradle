import org.apache.tools.ant.taskdefs.condition.Os

tasks.register('mkdocsServe', Exec) {
    description = "Serves the MkDocs server."
    group = "documentation"

    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        commandLine 'cmd.exe', '/c', 'docs\\build_scripts\\mkdocs.bat serve'
    } else {
        commandLine '/usr/bin/env', 'bash', '-c', 'docs/build_scripts/mkdocs.sh serve'
    }
}

tasks.register('mkdocsBuild', Exec) {
    description = "Builds the MkDocs documentation in docs/site."
    group = "documentation"

    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        commandLine 'cmd.exe', '/c', 'docs\\build_scripts\\mkdocs.bat build'
    } else {
        commandLine '/usr/bin/env', 'bash', '-c', 'docs/build_scripts/mkdocs.sh build'
    }
}

tasks.register('mkdocsKill', Exec) {
    description = "Kills the MkDocs server."
    group = "documentation"

    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        commandLine 'taskkill.exe', '/IM', '"mkdocs.exe"', '/F'
    } else {
        commandLine 'pkill', 'mkdocs'
    }
}