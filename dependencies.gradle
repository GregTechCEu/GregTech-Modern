    // Math Parser
    compileOnly(libs.evalEx.get())

    // MUI
    jarJar(implementation(forge.mui.get()))

    // NeoForge provides Mixin and MixinExtras. Minecraft 26.2 uses unobfuscated names.

    // Recipe Viewers
    compileOnly(forge.bundles.jei)
    compileOnly(forge.emi)

    // Jade (WAILA)
    compileOnly(forge.jade)

    // Curios
    compileOnly(variantOf(forge.curios) { classifier("api") })

    // AE2
    compileOnly(forge.ae2)

    // Create
    compileOnly(forge.ponder)
    compileOnly(variantOf(forge.create) { classifier("slim") })
    compileOnly(forge.flywheel.forge.api)

    // KJS
    compileOnly(forge.kubejs)
    compileOnly(forge.architectury)
    compileOnly(forge.rhino)

    // Performance
    compileOnly(forge.embeddium)
    compileOnly(forge.oculus)
    compileOnly(forge.modernfix)

