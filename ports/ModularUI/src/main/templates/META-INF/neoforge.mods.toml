type = "required"
versionRange = "[${minecraft_version}]"

[[dependencies.${ mod_id }]]
modId = "jei"
type = "optional"
versionRange = "[${jei_version},)"

[[dependencies.${ mod_id }]]
modId = "emi"
type = "optional"
versionRange = "[${emi_version},)"

[[dependencies.${mod_id}]]
modId = "roughlyenoughitems"
type = "optional"
versionRange = "[${rei_version},)"

[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "[${curios_version},)"
