name: Publish on Release

on:
  release:
    types: [released]

# TODO: Make it so you can publish releases for each mc-ver individually

jobs:
#  versioning:
#    name: Get Version to Publish
#    runs-on: ubuntu-latest
#    steps:
  meta:
    name: Metadata
    runs-on: ubuntu-latest
    outputs:
      CHANGELOG: ${{ steps.changelog.outputs.changelog }}
      TWENTY: ${{ contains(github.ref_name, '1.20.1') }}
      TWENTYONE: ${{ contains(github.ref_name, '1.21') }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Read Tag
        run: |
          echo ${{ github.event.release.tag }}
          echo ${{ github.ref }}
          echo ${{ github.ref_name }}
          echo ${{ contains(github.ref_name, '1.20.1') }}
          echo ${{ contains(github.ref_name, '1.21') }}
      - name: Get Config
        uses: actions/checkout@v4
        with:
          ref: '1.20.1'
          sparse-checkout: '.github/json'
      - name: Generate changelog
        id: changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: ./.github/json/config.json
          toTag: ${{ github.ref }}
          ignorePreReleases: true
          fetchViaCommits: true
          failOnError: true

  publish-20:
    name: 1.20.1
    needs: [ meta ]
    if: ${{ needs.meta.outputs.TWENTY || !needs.meta.outputs.TWENTYONE }}
    secrets: inherit
    uses: ./.github/workflows/publish.yml
    with:
      simulate: ${{ startsWith(github.event.release.name, 'simulate') || github.repository_owner != 'GregTechCEu' }}
      branch: '1.20.1'
      tag-name: ${{ github.ref_name }}
      release-body: ${{ github.event.release.body }}
      changelog-body: ${{ needs.meta.outputs.CHANGELOG }}

  publish-21:
    name: 1.21.1
    needs: [ meta ]
    if: ${{ needs.meta.outputs.TWENTYONE || !needs.meta.outputs.TWENTY }}
    secrets: inherit
    uses: ./.github/workflows/publish.yml
    with:
      simulate: ${{ startsWith(github.event.release.name, 'simulate') || github.repository_owner != 'GregTechCEu' }}
      branch: '1.21'
      tag-name: ${{ github.ref_name }}
      release-body: ${{ github.event.release.body }}
      changelog-body: ${{ needs.meta.outputs.CHANGELOG }}
