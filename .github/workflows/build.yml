name: Build GTCEu Mod JAR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build JAR on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x spotlessCheck -x spotlessKotlinCheck

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: gtceu-mod-jar
          path: build/libs/*.jar
