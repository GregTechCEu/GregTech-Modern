modLoader = "javafml"
loaderVersion = "[${loader_version},)"
issueTrackerURL = "${mod_issue_tracker}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "KilaBash, screret, Mikerooni, serenibyss, Tech22, YoungOnion, Mikerooni, Ghostipedia"
description = "${mod_description}"
logoFile = "icon.png"
displayURL = "${mod_url}"
credits = "GregoriusT, Mr_Touchyou, Zerrens for making GregTech and textures, the GT5u authors and maintainers for providing the original code, and the community."

enumExtensions = "META-INF/enum_extensions.json"
[mods."modernfix:integration"]
    client_entrypoint = "com.gregtechceu.gtceu.integration.modernfix.GTModernFixIntegration"

[[mixins]]
    config = "${mod_id}.mixins.json"
[[accessTransformers]]
    file = "META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    # Functionally required at end-user runtime: the bundled `lowdraglib` shim's utility
    # classes delegate to the patched `ldlib2-neoforge-26.1.2-gtceu.1.jar`. Declared
    # `optional` here so dev-time tasks like `runData` (which don't actually invoke ldlib2
    # code) don't hit FML's mod-presence check; release notes must document that end users
    # need to install the patched ldlib2 jar alongside gtceu.
    modId = "ldlib2"
    type = "optional"
    versionRange = "[${ldlib2_version},)"
    ordering = "AFTER"
    side = "BOTH"
    [dependencies.${mod_id}.mc-publish]
        ignore = true

[[dependencies.${mod_id}]]
    modId = "configuration"
    type = "required"
    embedded = true
    versionRange = "[${configuration_version},)"
    ordering = "AFTER"
    side = "BOTH"
    [dependencies.${mod_id}.mc-publish]
        ignore = false
        modrinth = "configuration"
        curseforge = "configuration"

[[dependencies.${mod_id}]]
    modId = "kubejs"
    type = "optional"
    versionRange = "[${kjs_version},)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "jei"
    type = "optional"
    versionRange = "[${jei_version},)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "emi"
    type = "optional"
    versionRange = "[${emi_version},)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "jade"
    type = "optional"
    versionRange = "[${jade_version},)"
    ordering = "NONE"
    side = "BOTH"


#[features.${mod_id}]
#openGLVersion = "[3.2,)"
